name: Verify GuidingHand

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend runtime dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Run backend tests without provider calls
        run: python -m unittest discover -s backend -p 'test_*.py' -v

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify Android candidate
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --console=plain
